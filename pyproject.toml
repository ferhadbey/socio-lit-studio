[project]
name = "socio-lit-studio"
version = "0.1.1"
description = "Sociology literature and journal scout with draft assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pypdf>=5.0",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.scripts]
socio-lit = "socio_lit_studio.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
